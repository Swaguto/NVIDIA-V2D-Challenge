# Experimental full-episode reproduction. Physical task acceptance is pending.
services:
  full-task:
    image: ${DEX3_REPAIRED_IMAGE:?Set the verified experimental image digest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 8gb
    environment:
      WANDB_MODE: disabled
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      JAX_COMPILATION_CACHE_DIR: /root/.cache/jax
      FLASH_CHORD_CACHE_DIR: /data/collision-cache
    volumes:
      - ${DEX3_TRAINING_INPUTS:?Set the private full-task input directory}:/data:ro
      - ${DEX3_TRAINING_OUTPUTS:?Set a fresh writable results directory}:/outputs
      - dex3-training-cache:/root/.cache
    command:
      - /opt/dex3-extension/train.py
      - --config-dir
      - /opt/dex3-extension/configs
      - experiment=dex3_repaired_velocity
      - scene.world_count=64
      - training.world_count=64
      - training.max_iterations=1000
      - training.save_interval=250
      - output_dir=/outputs/ppo
volumes:
  dex3-training-cache:
