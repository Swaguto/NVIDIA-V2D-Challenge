# Reproduce the failed session55 point-contact control; no training by default.
services:
  diagnostic:
    image: ${DEX3_EXPERIMENTAL_IMAGE:?Set the verified experimental image digest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 8gb
    environment:
      WANDB_MODE: disabled
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      FLASH_CHORD_CACHE_DIR: /data/collision-cache
    volumes:
      - ${DEX3_TRAINING_INPUTS:?Set the private corrected-clock input directory}:/data:ro
      - ${DEX3_TRAINING_OUTPUTS:?Set a fresh writable results directory}:/outputs
      - dex3-training-cache:/root/.cache
    command:
      - /opt/dex3-extension/diagnose_task.py
      - --config-dir
      - /opt/dex3-extension/configs
      - experiment=dex3_repaired_multicontact
      - sim.impratio=20
      - sim.cone=pyramidal
      - embodiment.config.hand_contact_profile=default
      - scene.world_count=4
      - output_dir=/outputs/diagnostic
volumes:
  dex3-training-cache:
