services:
  pilot:
    image: ${DEX3_TRAINING_IMAGE:-v2d-dex3-training:local}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 8gb
    environment:
      WANDB_MODE: disabled
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      FLASH_CHORD_CACHE_DIR: /data/collision-cache
    volumes:
      - ${DEX3_TRAINING_INPUTS:?Set private pilot input directory}:/data:ro
      - ${DEX3_TRAINING_OUTPUTS:?Set fresh writable output directory}:/outputs
      - dex3-training-cache:/root/.cache
    command: ["/opt/dex3-extension/train.py", "--config-dir", "/opt/dex3-extension/configs", "experiment=dex3_pilot"]
volumes:
  dex3-training-cache:
