# @package _global_
# Explicit new actor-initialized experiment. No training or reset assistance.
defaults:
  - dex3_grip_estimated_cws
  - _self_
training_assistance: disabled
voc_scale_override: 0.0
actor_initialization_checkpoint: /initial-policy/ppo/model_2000.safetensors
actor_initialization_context_manifest: /initial-context/context-manifest.json
actor_initialization_reset_transition: remove_training_settling
reset:
  voc_decay_steps: 0
curriculum:
  thresholds: [500, 1500]
  stages:
    - _target_: flash_chord.lifecycle.curriculum.CurriculumStage
      voc_scale: 0.0
      reset_to_first_frame_probability: 1.0
      objective_weights: &weights
        object_keypoints: 8.0
        hand_keypoints: 0.25
        hand_joint_pos: 0.02
        contact_wrench_support: 10.0
        missed_contact: 0.0
        unintended_contact: 0.0
        termination: -100.0
        action_rate_l2: -0.01
        action_l2: -0.002
        contact_force_l2: 0.0
        force_closure: 0.0
        robot_pad_support: 3.0
        robot_grip_stability: ${objective.grip_stability_weight}
        robot_carried_load: 4.0
        robot_carried_height: 6.0
        robot_excess_pad_force: -0.1
    - _target_: flash_chord.lifecycle.curriculum.CurriculumStage
      voc_scale: 0.0
      reset_to_first_frame_probability: 1.0
      objective_weights: *weights
training:
  max_iterations: 1500
  save_interval: 100
  network:
    initial_noise_std: 0.15
logging:
  run_name: grip-cws-unassisted-actor-continuation
output_dir: /outputs/grip-cws-unassisted
