name: Coverage reproduction controls

on:
  pull_request:
    paths:
      - 'scripts/reproduction/**'
      - 'reconstruction/validation/issue6/**'
      - 'reconstruction/modules/v2d_issue6/tests/test_automatic*.py'
      - 'reconstruction/modules/v2d_issue6/tests/test_hand_quality_support.py'
      - '.github/workflows/coverage_reproduction_cpu.yml'
  push:
    paths:
      - 'scripts/reproduction/**'
      - 'reconstruction/validation/issue6/**'
      - 'reconstruction/modules/v2d_issue6/tests/test_automatic*.py'
      - 'reconstruction/modules/v2d_issue6/tests/test_hand_quality_support.py'
      - '.github/workflows/coverage_reproduction_cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths on Windows before checkout
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.2.6 pytest==8.4.2 opencv-python-headless==4.11.0.86
      - run: python -m unittest discover -s scripts/reproduction -p "test_verify_*.py"
      - name: Hand evidence and geometry export controls
        run: >-
          python -m pytest
          reconstruction/modules/v2d_issue6/tests/test_hand_quality_support.py
          reconstruction/modules/v2d_issue6/tests/test_automatic_recovery.py
          reconstruction/modules/v2d_issue6/tests/test_automatic_reproduction.py -q
