name: Coverage reproduction controls

on:
  pull_request:
    paths:
      - 'scripts/reproduction/**'
      - '.github/workflows/coverage_reproduction_cpu.yml'
  push:
    paths:
      - 'scripts/reproduction/**'
      - '.github/workflows/coverage_reproduction_cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.2.6
      - run: python -m unittest discover -s scripts/reproduction -p "test_verify_*.py"
