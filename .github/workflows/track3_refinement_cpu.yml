name: Track 3 refinement CPU tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/track3/**'
      - 'reconstruction/modules/v2d_gsplat_refinement/**'
      - 'docs/team/issue7/**'
      - '.github/workflows/track3_refinement_cpu.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/track3/**'
      - 'reconstruction/modules/v2d_gsplat_refinement/**'
      - 'docs/team/issue7/**'
      - '.github/workflows/track3_refinement_cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.15.3 Pillow==11.3.0 pytest==8.4.2
      - name: Run refinement and adapter controls
        run: python -m pytest scripts/track3/tests -q --strict-markers --junitxml=refinement-cpu.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refinement-cpu-results
          path: refinement-cpu.xml
          if-no-files-found: error
