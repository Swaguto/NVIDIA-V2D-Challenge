name: Dex3 migration controls
on:
  push:
    paths: ['scripts/dex3_review/**', 'docker/dex3-review/**', '.github/workflows/dex3-review-container.yml']
  pull_request:
    paths: ['scripts/dex3_review/**', 'docker/dex3-review/**', '.github/workflows/dex3-review-container.yml']
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 numpy==2.2.6 scipy==1.15.3
      - run: python -m pytest scripts/dex3_review/tests -q
      - name: Check Compose configuration
        env:
          V2D_DATA_DIR: /tmp/v2d-data
          V2D_OUTPUT_DIR: /tmp/v2d-output
        run: docker compose -f docker/dex3-review/compose.yaml config --quiet
      - name: Check Dockerfiles without downloading simulator packages
        run: |
          docker buildx build --check --platform linux/amd64 -f docker/dex3-review/Dockerfile .
          docker buildx build --check --platform linux/amd64 -f docker/dex3-review/Dockerfile.continuity .
