name: Dex3 physics and reference controls
on:
  push:
    paths: ['scripts/track3/**', 'scripts/compute/**', 'scripts/dex3_physics/**', 'scripts/dex3_training/**', 'scripts/reproduction/**', 'docker/dex3-training/**', 'docker/dex3-review/physics.compose.yaml', '.github/workflows/dex3-physics-controls.yml']
  pull_request:
    paths: ['scripts/track3/**', 'scripts/compute/**', 'scripts/dex3_physics/**', 'scripts/dex3_training/**', 'scripts/reproduction/**', 'docker/dex3-training/**', 'docker/dex3-review/physics.compose.yaml', '.github/workflows/dex3-physics-controls.yml']
jobs:
  cpu-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 numpy==2.2.6 scipy==1.15.3 trimesh==4.5.1 pyarrow==18.1.0 opencv-python-headless==4.11.0.86 Pillow==11.3.0
      - run: python -m pytest scripts/compute/tests scripts/reproduction/tests scripts/dex3_physics/tests scripts/dex3_training/tests scripts/track3/tests/test_scored_inputs.py scripts/track3/tests/test_scored_hand_adapter.py scripts/track3/tests/test_stereo_reconstruction.py scripts/track3/tests/test_rgb_stereo.py scripts/track3/tests/test_bootstrap_tracking.py scripts/track3/tests/test_camera_prior.py scripts/track3/tests/test_support_plane.py scripts/track3/tests/test_scored_commands.py -q
      - name: Verify persistent cache in training Compose services
        run: python scripts/compute/check_compose_cache.py
      - name: Check physics Compose overlay
        env:
          V2D_DATA_DIR: /tmp/data
          V2D_OUTPUT_DIR: /tmp/out
          V2D_CODE_DIR: /tmp/code
          V2D_PHYSICS_ARCHIVE: /tmp/input-pack.tar.gz
        run: docker compose -f docker/dex3-review/compose.yaml -f docker/dex3-review/physics.compose.yaml config --quiet
      - name: Check training Compose
        env:
          DEX3_TRAINING_INPUTS: /tmp/data
          DEX3_TRAINING_OUTPUTS: /tmp/out
        run: docker compose -f docker/dex3-training/compose.yaml config --quiet
