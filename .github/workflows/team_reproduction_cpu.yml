name: Team reproduction controls

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/reproduce/**'
      - 'docs/team/reproduction/**'
      - 'reconstruction/modules/v2d_issue6/**'
      - 'scripts/track3/**'
      - '.github/workflows/team_reproduction_cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -r scripts/reproduce/requirements-cpu.txt
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check archive validation and measurement comparisons
        run: python -m pytest scripts/reproduce/tests -q --strict-markers
      - name: Check issue 6 and 7 contracts from the same checkout
        env:
          PYTHONPATH: reconstruction/modules/v2d_issue6
        run: python -m pytest reconstruction/modules/v2d_issue6/tests scripts/track3/tests -q --strict-markers
