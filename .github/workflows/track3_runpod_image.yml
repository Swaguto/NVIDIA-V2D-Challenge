name: Track 3 RunPod image

on:
  push:
    branches: [main, feat/track3-runpod-validation]
    paths:
      - docker/track3-runpod/Dockerfile
      - docker/track3-runpod/start.sh
      - reconstruction/modules/v2d_foundation_pose/lib/FoundationPose/**
      - .github/workflows/track3_runpod_image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: track3-runpod-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/track3-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/swaguto/track3-runpod:${{ github.sha }}
            ttl.sh/v2d-track3-${{ github.sha }}:24h
          provenance: false
