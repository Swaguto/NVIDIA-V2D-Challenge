name: Track 3 pilot CPU tests

on:
  pull_request:
    branches: [main, Evc-r/issue7-refinement-validation]
    paths:
      - 'scripts/track3/**'
      - 'reconstruction/modules/v2d_gsplat_refinement/**'
      - 'robotic_grounding/scripts/retarget/**'
      - 'robotic_grounding/source/robotic_grounding/robotic_grounding/retarget/**'
      - 'robotic_grounding/tests/test_track3_*.py'
      - '.github/workflows/track3_pilot_cpu.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/track3/**'
      - 'reconstruction/modules/v2d_gsplat_refinement/**'
      - 'robotic_grounding/scripts/retarget/**'
      - 'robotic_grounding/source/robotic_grounding/robotic_grounding/retarget/**'
      - 'robotic_grounding/tests/test_track3_*.py'
      - '.github/workflows/track3_pilot_cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: robotic_grounding/source/robotic_grounding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.15.3 Pillow==11.3.0 pytest==8.4.2 trimesh==4.5.1 rtree==1.3.0
      - name: Run Issue 7 refinement controls
        run: python -m pytest scripts/track3/tests -q --strict-markers --junitxml=refinement-cpu.xml
      - name: Run Issue 8 bundle and collision controls
        if: success() || failure()
        run: |
          python -m pytest robotic_grounding/tests/test_track3_bundle.py robotic_grounding/tests/test_track3_penetration.py robotic_grounding/tests/test_track3_collision_bounds.py robotic_grounding/tests/test_track3_collision_voxels.py -q --strict-markers --junitxml=issue8-cpu.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track3-pilot-cpu-results
          path: |
            refinement-cpu.xml
            issue8-cpu.xml
          if-no-files-found: error
