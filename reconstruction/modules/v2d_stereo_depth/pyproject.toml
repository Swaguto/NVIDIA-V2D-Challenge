[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2d-stereo-depth"
version = "0.1.0"
description = "Metric depth from the published rig stereo calibration (RGB only)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
]

[tool.setuptools]
packages = ["v2d.stereo_depth.lib"]

[tool.setuptools.package-dir]
"v2d.stereo_depth.lib" = "lib"
